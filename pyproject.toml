[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looped-flows-cpu"
version = "0.1.0"
description = "A small, offline CPU demonstration of inference-time scaling with looped probability flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "matplotlib>=3.8,<4",
]
qwen = [
  "transformers>=4.45,<6",
  "safetensors>=0.4,<1",
]

[project.scripts]
looped-flows-experiment = "looped_flows_cpu.experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
